# Netlify builds this site: it downloads the live catalog from namastebookshop.com and generates ./dist.
# Python 3 is available in Netlify's build image; no npm dependencies.
[build]
  publish = "dist"
  # PREVIEW: --preview keeps the netlify.app site out of search. Remove --preview when going live on the domain.
  command = "python3 scripts/fetch.py && python3 scripts/build.py --preview"

[context.deploy-preview]
  command = "python3 scripts/fetch.py && python3 scripts/build.py --preview"
[context.branch-deploy]
  command = "python3 scripts/fetch.py && python3 scripts/build.py --preview"
